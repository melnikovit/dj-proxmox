global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/cadvisor.json
        refresh_interval: 15s

  - job_name: node
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/node.json
        refresh_interval: 15s

  - job_name: dj-proxmox-agents
    # Путь задаётся в file_sd (__metrics_path__=/api/metrics/agent/{endpointId}).
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/agents.json
        refresh_interval: 15s
